<!DOCTYPE html>
<html lang="en">

<style>

@font-face {
    font-family:"coito";
    src: url(fonts/Parisienne-Regular.ttf);
}
    {
        margin: 0;
        padding: 0;
        text-decoration: none;
        list-style: none;
    }
    body{
        width: 650px;
        margin-left: auto;

        margin-top:0;

    }
    .grande{
        width: 650px;
        height: 400px;

    .cajaEnlace{
        width: 100px; ;
        height: 100px;;

    }

    #primero{
        background-color: moccasin;
        display: flex;
        justify-content: center;

    }
    #primero:hover{
        background-color: violet;
    }

    #segundo{
        background-color: aqua;
        display: flex;
        justify-content:space-evenly ;
        align-items: center;

 
    }

    .retratro{
        width: 300px; 
        height: 300px;
        background-color:  plum; 
        border-radius: 20px;
    

    }
    #Maluma{
            background-image: url(images/88de642d57a158c7f1b6753f195c3b26.webp);
        background-size: 100% 100%;
        /*opcional*/
        background-position:center;
        background-repeat: no-repeat;

    }
        #Maluma:hover{
        background-size: 400% 400%;
        }


    #Bertin{
                background-image: url(images/bertin-osborne-16-9-aspect-ratio-default-1013583_da39.webp);
        background-size: 100% 100%;
        /*opcional*/
        background-position:center;
        background-repeat: no-repeat;

        }
        
    #tercero{
        height: 200px;
        background-color: chocolate;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        flex-direction: column;

    }
    
    #tercero:active{
        background-color: green;
        
    }

    .titulo{
        /*tipo de fuente*/
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        /*tamaño de fuente*/
        font-size: 30px;
        /*Estilo de fuente*/
        font-style: italic;
        /*Resaltado*/
        font-weight: lighter;
        /*Color de la fuente*/
        color: skyblue;
        /*sombra del texto*/
        text-shadow: 0 0 3px lightblue;
        -webkit-text-stroke-width: 1px;
        -webkit-animation: infinite;
        -webkit-text-stroke-color: white;
    }   
    
    .parrafo{
        width: 500px;
        /*Alineacion del texto*/
        text-align: justify;
        /*tipo de fuente*/
        font-family: coito;

<body>
    <section class="grande" id="primero">
        <article class="cajaEnlace" id="cajaEnlace">

        </article>

        <article class="retratro" id="Bertin"></article>
