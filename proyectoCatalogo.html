                    <img id="001" src="imagenes/lockandKey1.jpg"

                    data-autor="Joe Hill"
                    data-sinopsis="El primero de los tres volúmenes que recopilan la obra maestra de Joe Hill y Gabriel Rodríguez. En Nueva Inglaterra hay una vieja mansión cuyas fabulosas puertas transforman a todo el que se atreve a cruzarlas. El pasado de la familia Locke vuelve para atormentar a sus actuales miembros, en un escalofriante cómic en el que Hill demuestra una capacidad para la narrativa, la invención y la originalidad equiparable a la de su padre, Stephen King."

                    <img id="002" src="imagenes/planetary.jpg"
                    data-nombre="planetary" data-genero="Ciencia Ficción"
                    data-editorial="ECC" data-autor="Warren Ellis"
                    data-precio="40.5€"
                    data-sinopsis="Warren Ellis y John cassaday nos ofrecen este relato épico y complejo sobre una fuerza de pacificación interdimensional cuya tarea consiste en seguir el rastro de pruebas de actividad sobrehumana. Estos arqueólogos del misterio descubren secretos y relatos paranormales y desconocidos, como un superordenador de la segunda guerra mundial que accede a otros universos, un espíritu fantasmagórico de la venganza, una isla perdida habitada por monstruos moribundos, un portal que conduce al tiempo onírico o un objeto alienígena que vaga a la deriva por nuestro sistema solar.">
                  
                    <img id="003" src="imagenes/eslavaGalan.webp"
                    data-nombre="Enciclopedia Eslava" data-genero="Histórico/Ensayo"

                    data-precio="22.95€"
                    data-sinopsis="En esta nueva edición de Enciclopedia Eslava, Juan Eslava Galán explora los temas de historia, misterio y leyenda que más le han interesado a lo largo de su vida: ¿Cómo era el sexo en la prehistoria?, ¿Qué hay de verdad en la leyenda de la Atlántida, o en el fabuloso reino de Tarteso?, ¿En qué consistía el pecado griego?, ¿Cómo crucificaban los romanos?, ¿Cómo vivían los gladiadores?, ¿Se practicó la prostitución sagrada en España?, ¿Por qué prohibían los godos que un calvo fuera rey?,"
                    >

                    data-sinopsis="Alain Delambre tiene cincuenta y siete años y lleva cuatro parado. Un día, de forma casi milagrosa, le ofrecen presentarse a un proceso de selección para un nuevo empleo como directivo de una gran empresa. ¿El único problema? El proceso requiere actuar de forma casi inhumana, ya que se trata de la simulación de una toma de rehenes."

                    data-sinopsis="En los albores de su cruzada contra el crimen, el Caballero Oscuro trata de descubrir la identidad de Festivo: misterioso homicida que, aprovechando fechas señaladas del calendario, está perpetrando una serie de asesinatos. Con las familias criminales de Gotham en pie de guerra, Batman tan solo contará con la ayuda de James Gordon y Harvey Dent para resolver este caso..."

                    data-sinopsis="¿Sabes qué es peor que romper con tu novia? Tener que cuidar de su multipremiada gata de exhibición. ¿Y sabes qué es aún peor? Enfrentarse a una invasión alienígena, la destrucción de todas las estructuras terrestres creadas por la humanidad y la explotación sistemática de los supervivientes mediante un sádico programa de entretenimiento intergaláctico."
                    >
                    <img id="007" src="imagenes/busconIndias.jpg"
                    data-nombre="El buscón de las Indias" data-genero="Comedia/Fantástico"
                    data-editorial="Norma Editorial" data-autor="Alain Ayroles"
                    data-precio="35€"
                    data-sinopsis="Quevedo alcanzó en El Buscón una de las cumbres de la literatura española de todos los tiempos. En su último párrafo, el pícaro Pablos resume el resto de su vida: viajó a las Indias en busca de fortuna, y su suerte no hizo sino empeorar. Pablos prometió detallar los pormenores de ese viaje en una segunda parte que Quevedo jamás escribió y que el dibujante español Juanjo Guarnido (Blacksad ) y el guionista francés Alain Ayroles (De capa y colmillos, D. Diario de un no muerto) han concluido en un cómic magistral."
                    >
                    <img id="008" src="imagenes/volutandMuchos.jpg"
                    data-nombre="La voluntad de muchos" data-genero="Fantástico"
                    data-editorial="Editorial Hidra" data-autor="James Islington"
                    data-precio="25.65€"
                    data-sinopsis="Los habitantes de la república Catena, también llamada la Jerarquía, quizá dominen el mundo, pero no lo saben todo.
Les he dicho que mi nombre es Vis Telimus. Les he dicho que me convertí en huérfano después de un trágico accidente hace tres años, y que ha sido solo la buena fortuna la que ha hecho que me acepten en su escuela más prestigiosa. Les he dicho que una vez que me gradúe me uniré gustosamente al resto de la sociedad civilizada, lo que quiere decir que permitiré que mi fuerza, mis deseos y mi determinación, lo que ellos llaman la Voluntad, sean parasitados y añadidos al poder de aquellos que están por encima de mí, como ya lo hacen millones. Como todos deben acabar haciendo."
                    >
                    <img id="009" src="imagenes/longJonSilver.jpg"
                    data-nombre="Long John Silver" data-genero="Aventuras"
                    data-editorial="Norma Editorial" data-autor="Xavier Dorison"
                    data-precio="39.95€"
                    data-sinopsis="Es el hijo de la tinta y la pluma, la figura de proa de La isla del tesoro de R. L. Stevenson. Ha vivido de crímenes y sueños, conocido los galeones de madera, el saqueo de Maracaibo y las revueltas de bucaneros. Mezclará el oro y la sangre para sellar su destino en los confines de los reinos perdidos de la Amazonia."
                    >
                    <img id="010" src="imagenes/caballeroDelosSieteReinos.webp"
                    data-nombre="El caballero de los Siete Reinos" data-genero="Fantástico"
                    data-editorial="Plaza & Janes" data-autor="George R.R. Martin"
                    data-precio="25.55€"
                    data-sinopsis="El joven Ser Duncan el Alto, un ingenuo pero valiente caballero errante, sobresale por encima de sus rivales en estatura, aunque no en experiencia. Le acompaña su diminuto escudero, un muchacho llamado Egg, quien debe mantener en secreto su verdadera identidad ante todos aquellos que se crucen en su camino.
Puede que nadie hubiera esperado ver a estos inesperados compañeros convertidos en héroes, pero el destino tiene reservado para ellos un camino plagado de poderosos enemigos, intrigas palaciegas y hazañas de leyenda."
                    >
                    <img id="011" src="imagenes/blackSad.jpg"
                    data-nombre="Blacksad - Integral" data-genero="Crimen/Noir"
                    data-editorial="Norma Editorial" data-autor="Juán Díaz Canales"
                    data-precio="49€"
                    data-sinopsis="Él es un detective privado sombrío,ataviado con una gabardina típica de cualquier película de Humphrey Bogart... pero es un gato. El dúo de españoles formado por Díaz Canales y Guarnido reformularon el género negro en el cómic europeo dotándolo de un gran significado gráfico, sacado de la gran experiencia del dibujante en los estudios Disney. Un cómic para adultos que muestra la dureza del mundo animal, unido a los instintos humanos más salvajes, lo que demuestra el frágil límite entre especies"
                    >
                    <img id="012" src="imagenes/historiaEsp.webp"
                    data-nombre="Historia de España contada para Escepticos" data-genero="Histórico"
                    data-editorial="Booket" data-autor="Juan Eslava Galán"
                    data-precio="13.25"
                    data-sinopsis="En este libro no he pretendido escribir la historia que escri­biría el pueblo, ya que el pueblo es ágrafo por naturaleza, sino, más bien, una Historia de España contada para escépticos que no creen en la historia de España.
No pretendo que sea veraz, justa y desapasionada, porque ninguna historia lo es, pero por lo menos intentaré que no mienta ni tergiverse a sabiendas, que ya es un propósito so­bradamente ambicioso en los tiempos que corren. "
                    >

                    data-precio="25€"
                    data-sinopsis="Todas las aventuras de Spiderman Noir en solitario, en un único volumen. Un gran poder conlleva una gran responsabilidad. Pero cuando aquellos que tienen ese poder abusan de él, el pueblo tiene la responsabilidad de derribarlos. El año es 1933. Nueva York está gobernada por políticos corruptos, policías que no hacen nada por proteger a los inocentes y hombres de negocios sin escrúpulos."
                    >

                    data-precio="19,85€"
                    data-sinopsis="El Muerto, un jinete que cabalga eternamente por la llanura mexicana y cuya historia parece salida de una novela de Cormac McCarthy. El cazador de Anchorage, un hombre que disfruta atrapando a mujeres en su fi nca. Carl Tanzer, un científico vanguardista que quiere romper las barreras del amor más allá de la muerte."
                    >
                    <img id="015" src="imagenes/laCosaPantano1.jpg"
                    data-nombre="La Cosa del Pantano #1" data-genero="Fantástico"
                    data-editorial="Panini Comics" data-autor="Alan Moore"
                    data-precio="25,60€"
                    data-sinopsis="Antes de dejar huella con Watchmen, un revolucionario escritor inglés debutó en el mercado estadounidense en 1983 con la revitalización del horror cósmico y de un icono del cómic junto a un trio de rompedores artistas estadounidenses. Al final de su etapa cuatro años después, La Cosa del Pantano de Alan Moore, Stephen R. Bissette, John Totleben y Rick Veitch era universalmente reconocido como uno de los títulos que definieron una nueva era de complejidad y profundidad en la narrativa del cómic, y aún hoy sigue siendo una de las mayores obras maestras del medio."
                    >
                    <img id="016" src="imagenes/problema3cuerpos.webp"
                    data-nombre="El problema de los tres cuerpos" data-genero="Sci-Fy"
                    data-editorial="B de Bolsillo" data-autor="Cixin Liu"
                    data-precio="14,20€"
                    data-sinopsis="«Las novelas de Cixin Liu son maravillosas. Las recomiendo muchísimo».José Manuel Nieves, Cuarto Milenio
«Un descubrimiento científico y filosófico único». George R. R. Martin
«Increíblemente imaginativa». Barack Obama
El problema de los tres cuerpos es la primera novela no escrita originariamente en inglés galardonada con el premio Hugo, el Nobel del género de la ciencia ficción.
Su autor, Cixin Liu, ha sido considerado el gran descubrimiento del género y es capaz de vender cuatro millones de ejemplares solamente en China y de hacerse con prescriptores de la talla de Barack Obama, quien seleccionó El problema de los tres cuerpos como una de sus lecturas navideñas "
                    >
                    <img id="017" src="imagenes/watchmen.jpg"
                    data-nombre="Watchmen" data-genero="Acción/Superheroes"
                    data-editorial="ECC" data-autor="Alan Moore"
                    data-precio="90€"
                    data-sinopsis="El asesinato de un antiguo superhéroe y la posterior investigación del crimen no son más que el comienzo de uno de los cómics más aclamados de la historia, uno donde el mundo se aproxima a una catástrofe nuclear mientras sus defensores se ven obligados a resurgir de sus cenizas. Sin embargo, ¿quiénes son esos personajes? ¿Cuál fue la auténtica historia de sus predecesores, los Minutemen? ¿Cómo fue la relación entre Espectro de Seda y su madre? ¿Qué tuvo que ver el Comediante con los Kennedy?"
                    >
                    <img id="018" src="imagenes/sapiens.webp"
                    data-nombre="Sapiens" data-genero="Ensayo/Filosofía"
                    data-editorial="Debate" data-autor="Yuval Noah"
                    data-precio="19.85€"
                    data-sinopsis="Hace 70.000 años al menos seis especies de humanos habitaban la Tierra. Hoy solo queda una, la nuestra: Homo Sapiens. ¿Cómo logró imponerse en la lucha por la existencia? ¿Por qué nuestros ancestros recolectores se unieron para crear ciudades y reinos? ¿Cómo llegamos a creer en dioses, en naciones o en los derechos humanos; a confiar en el dinero, en los libros o en las leyes? ¿Cómo acabamos sometidos a la burocracia, a los horarios y al consumismo? ¿Y cómo será el mundo en los milenios venideros?"
                    >

                    data-precio="19.85€"
                    data-sinopsis="Mark Grayson es como casi todos los jóvenes de su edad. Está en el último año de un instituto americano normal. Tiene un trabajo basura a tiempo parcial después de la escuela y los fines de semana. Le gustan bastante las chicas, pero no las entiende del todo. Le gusta salir con sus amigos y dormir hasta tarde los sábados (al menos hasta que comienzan sus dibujos animados favoritos). La única diferencia entre Mark y los demás es que su padre es el superhéroe más poderoso del planeta... y últimamente parece que ha heredado sus poderes."
